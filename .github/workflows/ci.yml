name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Cross-platform orchestration, schema and gate tests: no ffmpeg, so a
  # portability bug is caught on every OS without multiplying media runs.
  # Media-dependent test classes skip themselves when ffmpeg is absent.
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow (optional at runtime; the contact-sheet tests need it)
        run: pip install Pillow
      - name: Byte-compile
        run: python -m compileall -q scripts tests bench
      - name: Fast tests (gates, workflow controller, transcript status, audit, security)
        run: python -m unittest discover -s tests -v

  # Linux media-engine integration: the tests synthesize their fixtures with ffmpeg.
  media:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (the tests synthesize their own fixtures with it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pillow (optional at runtime; the visual-state tests need its box filter)
        run: pip install Pillow
      - name: Byte-compile
        run: python -m compileall -q scripts tests bench
      - name: Test (full suite incl. media integration)
        run: python -m unittest discover -s tests -v
